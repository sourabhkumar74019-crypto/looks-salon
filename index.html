isplay: flex; justify-content: center; background: #F8EEE9\">\n<div style=\"width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; gap: 32px 64px\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #8F5240\">Visit<\u002Fspan>\n<span style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(26px, 6vw, 34px); line-height: 1.15\">[YOUR ADDRESS]<br>[YOUR CITY]<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; font-size: 16px\">\n<div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #EAD6CD\"><span>Monday to Saturday<\u002Fspan><span style=\"font-weight: 700\">[10:00 am to 8:00 pm]<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 14px 0\"><span>Sunday<\u002Fspan><span style=\"font-weight: 700\">[11:00 am to 7:00 pm]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 100%; box-sizing: border-box; padding: 24px 20px; display: flex; justify-content: center; background: #3B2A26; color: #EAD6CD\">\n<div style=\"width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; align-items: center; font-size: 14px\">\n<span style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 24px; color: #FFFFFF\">Aurelle<\u002Fspan>\n<span>Beauty salon and spa. Prices shown are samples.<\u002Fspan>\n<a href=\"#top\" style=\"color: #FFFFFF; font-weight: 700; padding: 10px 0\">Back to top<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:4900}}\">\nclass Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = { sent: false };\n}\nrenderVals() {\nconst { sent } = this.state;\nreturn {\nshowForm: !sent,\nshowThanks: sent,\nsend: () => this.setState({ sent: true }),\nreset: () => this.setState({ sent: false })\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
